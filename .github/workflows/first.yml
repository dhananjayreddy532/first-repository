name: First Workflow

on: push

jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4
          
        - name: List Files and Read README.md 
          run: |
             echo "My first workflow"
             ls -ltra
             cat README.md

        - name: Generate ASCII Artwork
          run: cowsay -f dragon "Run for cover , the dragon is coming! " >> dragon.txt
          
